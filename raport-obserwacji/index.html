<!doctype html>

<head>
<meta charset="utf-8">

<title>Rzadkie ptaki</title>
<style>
  /* Calm, natural layout: warm paper, forest green, gentle accents.
     No loud badges — meanings are conveyed by a colored dot and quiet typography.
     Always light — no prefers-color-scheme dark variant (removed 2026-11-07: on
     dark-theme devices the dark palette read as a revert to the old template).
     The time span is chosen with a two-sided 1-7 day slider; the handles may cross
     freely, the range is always [min, max] of their positions (no handle can get stuck). */
  :root {
    color-scheme: light;
    --paper: #f6f3ea;
    --surface: #fffdf7;
    --ink: #33322a;
    --muted: #7c7867;
    --faint: #a49f8d;
    --hairline: #e6e1d2;
    --moss: #47634a;
    --moss-soft: #eaf0e4;
    --ochre: #a3762e;
    --ochre-soft: #f5ecd7;
    --sage: #6d7566;
    --sage-soft: #edece3;
    --warn: #8a5a2b;
    --warn-soft: #f4ecdd;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 28px max(18px, env(safe-area-inset-left, 0px)) 64px max(18px, env(safe-area-inset-right, 0px));
    background:
      radial-gradient(1100px 420px at 85% -80px, var(--moss-soft), transparent 70%),
      radial-gradient(900px 380px at -120px 25%, var(--ochre-soft), transparent 75%),
      radial-gradient(var(--hairline) 1px, transparent 1.3px),
      var(--paper);
    background-size: auto, auto, 26px 26px, auto;
    color: var(--ink);
    font: 15px/1.55 var(--sans);
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  /* --- header --- */
  header { margin-bottom: 14px; }
  .brand { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 {
    font: 400 2.05rem/1.12 var(--serif);
    letter-spacing: 0.01em;
    margin: 0;
  }
  .flock { flex: 0 0 auto; margin-top: 4px; color: var(--moss); }
  .flock svg { display: block; }
  /* ornament: thin lines with a leaf, separating the header from the filter */
  .ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 2px 0 26px; color: var(--sage); }
  .ornament::before, .ornament::after { content: ""; flex: 1 1 40px; max-width: 150px; border-top: 1px solid var(--hairline); }
  .ornament svg { display: block; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  .warn {
    background: var(--warn-soft); color: var(--warn);
    border-left: 2px solid var(--warn);
    padding: 10px 14px; margin-top: 16px; font-size: 0.85rem; border-radius: 0 6px 6px 0;
  }

  /* --- day-range slider (two-sided) --- */
  .range { margin: 4px 0 22px; }
  .range-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .range-cap { color: var(--faint); font-size: 0.75rem; }
  .range-lbl { color: var(--moss); font-size: 0.82rem; }
  .range-box { position: relative; height: 26px; touch-action: none; }
  .range-track { position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: var(--hairline); border-radius: 1px; }
  .range-fill { position: absolute; top: 12px; height: 2px; background: linear-gradient(90deg, var(--sage), var(--moss)); border-radius: 1px; }
  .range-box input[type="range"] {
    position: absolute; left: 0; width: 100%; top: 0; height: 26px; margin: 0;
    -webkit-appearance: none; appearance: none; background: none; pointer-events: none;
  }
  .range-box input[type="range"]:focus-visible { outline: none; }
  .range-box input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--moss);
    pointer-events: auto; cursor: grab; box-shadow: 0 0 0 4px var(--paper);
  }
  .range-box input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; background: var(--moss-soft); }
  .range-box input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--moss);
    pointer-events: auto; cursor: grab;
  }
  .range-box input[type="range"]:active::-moz-range-thumb { background: var(--moss-soft); }
  .range-box input[type="range"]::-moz-range-track { background: none; }
  .range-ticks { display: flex; justify-content: space-between; padding: 0 7px; margin-top: 3px; }
  .range-ticks span { color: var(--faint); font-size: 0.68rem; width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
  .range-ticks span:last-child { color: var(--muted); }

  /* --- filters: quiet, thin, no fills --- */
  .bar { display: flex; flex-direction: column; gap: 10px; margin: 0 0 30px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  button:focus-visible { outline: 1.5px solid var(--moss); outline-offset: 3px; border-radius: 3px; }
  .pill { font-size: 0.88rem; color: var(--muted); padding: 1px 0; border-bottom: 1.5px solid transparent; transition: color 0.2s ease; }
  .pill:hover { color: var(--ink); }
  .pill[aria-pressed="true"] { color: var(--moss); border-bottom-color: var(--moss); }
  .pill .n { color: var(--faint); font-size: 0.75rem; margin-left: 3px; }
  .pill.zero { opacity: 0.45; }
  /* compact expand/collapse-all toggle at the end of the grouping bar */
  .mini { margin-left: auto; background: none; border: 0; cursor: pointer; font: 400 0.75rem var(--sans); color: var(--faint); padding: 1px 0; letter-spacing: 0.02em; }
  .mini:hover { color: var(--moss); text-decoration: underline; text-underline-offset: 3px; }
  .chip { font-size: 0.85rem; color: var(--muted); display: inline-flex; align-items: baseline; gap: 5px; }
  .chip[aria-pressed="false"] { opacity: 0.4; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }

  /* --- region sections: soft cards on paper --- */
  section {
    margin: 0 0 28px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 20px 22px 8px;
    box-shadow: 0 1px 2px rgba(51, 50, 42, 0.05), 0 14px 30px -24px rgba(51, 50, 42, 0.3);
  }
  h2 { font: 400 1.25rem/1.2 var(--serif); margin: 0 0 4px; }
  h2 .cnt { font-family: var(--sans); font-weight: 400; color: var(--faint); font-size: 0.78rem; margin-left: 10px; }
  .region-hr { border: 0; border-top: 1px solid var(--hairline); margin: 0 0 4px; }
  .list { display: flex; flex-direction: column; }

  /* --- species: a calm row separated by a hairline, no boxes --- */
  .sp { padding: 16px 10px 18px; margin: 0 -8px; border-bottom: 1px solid var(--hairline); border-radius: 8px; transition: background-color 0.25s ease; }
  .sp:last-child { border-bottom: 0; }
  .sp:hover { background: color-mix(in srgb, var(--moss-soft) 55%, transparent); }
  .nm { font: 500 1.05rem/1.3 var(--sans); }
  .nm .la { font: italic 400 0.92rem var(--serif); color: var(--muted); margin-left: 8px; }
  .nm .cnt { font-family: var(--sans); font-weight: 400; color: var(--faint); font-size: 0.78rem; margin-left: 10px; }
  .kind { font-size: 0.8rem; margin-left: 10px; white-space: nowrap; }
  .kind .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; transform: translateY(-1px); }
  .kind.lifer { color: var(--moss); } .kind.lifer .dot { background: var(--moss); }
  .kind.rare { color: var(--ochre); } .kind.rare .dot { background: var(--ochre); }
  .kind.tick { color: var(--sage); } .kind.tick .dot { background: var(--sage); }
  .places { font-size: 0.9rem; color: var(--muted); margin-top: 6px; }
  a { color: var(--moss); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 0.8rem; color: var(--faint); user-select: none; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--moss); }
  summary::before { content: "· "; }
  /* summary that doubles as the places line (many locations): same look as
     .places, only clickable to unfold the hidden location list */
  summary.places { font-size: 0.9rem; color: var(--muted); }
  /* summary that doubles as the location header (locations view): same look as
     .nm, clickable to unfold the species list — collapsed by default. The chevron
     is the only added affordance; ul inside keeps its own 10px margin, so the
     details wrapper itself adds none */
  summary.nm { font: 500 1.05rem/1.3 var(--sans); color: inherit; }
  summary.nm::before { content: "▸"; display: inline-block; width: 1em; margin-right: 4px; font-size: 0.72rem; color: var(--faint); transition: transform 0.15s ease; }
  details[open] > summary.nm::before { transform: rotate(90deg); }
  details.loc { margin-top: 0; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li { font-size: 0.84rem; color: var(--muted); padding: 3.5px 0; }
  li .d { color: var(--ink); font-variant-numeric: tabular-nums; }
  li .t { font-style: italic; color: var(--faint); }
  li .new { color: var(--moss); background: var(--moss-soft); border-radius: 999px; padding: 1px 7px; font-size: 0.68rem; margin-left: 7px; letter-spacing: 0.03em; white-space: nowrap; }
  .pin { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; border: 1px solid var(--hairline); border-radius: 5px; padding: 2px; margin-left: 6px; vertical-align: -4px; background: var(--surface); }
  .pin:hover { border-color: var(--moss); text-decoration: none; }
  .pin img { width: 13px; height: 13px; display: block; border-radius: 2px; }
  .pin span { color: var(--faint); font-size: 0.7rem; }

  /* --- map view (Leaflet, lazy-loaded; tiles CARTO Positron to match the paper look) --- */
  .ref-pin { filter: drop-shadow(0 1px 1px rgba(51, 50, 42, 0.25)); }
  .mapbox { height: clamp(320px, 58vh, 520px); border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; margin: 14px 0 4px; background: var(--surface); }
  .map-empty { display: flex; align-items: center; justify-content: center; height: 100%; text-align: center; color: var(--muted); font-family: var(--serif); font-style: italic; padding: 0 16px; }
  .map-legend { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: var(--faint); font-size: 0.75rem; margin-top: 6px; }
  .map-legend .sw { display: inline-block; border-radius: 50%; flex: 0 0 auto; }
  .leaflet-container { font: 12px/1.4 var(--sans); background: var(--surface); }
  .leaflet-popup-content { font: 12.5px/1.5 var(--sans); margin: 10px 12px; min-width: 150px; }
  .leaflet-popup-content strong { font: 500 1.02rem/1.3 var(--serif); }

  .empty { text-align: center; color: var(--muted); padding: 48px 8px; font-family: var(--serif); font-style: italic; font-size: 1rem; }
  footer { color: var(--faint); font-size: 0.75rem; margin-top: 44px; text-align: center; }
  footer .orn { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--sage); margin-bottom: 12px; }
  footer .orn::before, footer .orn::after { content: ""; flex: 1 1 40px; max-width: 150px; border-top: 1px solid var(--hairline); }
</style>
</head>

<script>
(function () {
  var TYPES = [["Lifer", "życiówki", "lifer"], ["Rare", "rzadkie", "rare"], ["Year tick", "rokówki", "tick"]];
  var KIND_PL = {"Lifer": "życiówka", "Rare": "rzadki", "Year tick": "rokówka"};
  var data = JSON.parse(document.getElementById("rp-data").textContent);
  // Slider axis: 0 = 6 days ago (left end), 6 = today (right end).
  // st.a / st.b are the handle positions; they may cross freely — the range is
  // always [min, max] of their values, so no handle can get stuck on the other.
  var st = {region: "", types: {"Lifer": true, "Rare": true, "Year tick": true}, grup: "gatunki", a: 0, b: 6, sortLoc: "", sortSp: "", km: 50};
  var today = new Date(data.today + "T00:00:00Z");
  var el = function (id) { return document.getElementById(id); };
  var DAY = 86400000;
  var raf = typeof window !== "undefined" && window.requestAnimationFrame ? function (f) { window.requestAnimationFrame(f); } : function (f) { f(); };
  var rafPending = false;

  function dAgo(d) {
    var p = (d || "").split("-");
    if (p.length !== 3) return -1;
    var t = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return Math.round((today - t) / DAY);
  }
  function dateAgo(n) { var t = new Date(today.getTime() - n * DAY); return t.getUTCDate() + "." + (t.getUTCMonth() + 1) + "."; }
  function fmt(d) { var p = (d || "").split("-"); return p.length === 3 ? p[2] + "." + p[1] : (d || "–"); }

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem("rp-filters2") || "null");
      if (v && v.region !== undefined) {
        st.region = v.region || "";
        st.types = v.types || st.types;
        if (v.grup === "lokalizacje" || v.grup === "gatunki" || v.grup === "mapa") st.grup = v.grup;
        if (v.sortLoc === "dist") st.sortLoc = "dist";
        if (v.sortLoc === "alpha") st.sortLoc = "alpha";
        if (v.sortSp === "count") st.sortSp = "count";
        if (typeof v.km === "number" && v.km >= 5 && v.km <= 150) st.km = v.km;
        if (typeof v.a === "number" && typeof v.b === "number" && v.a >= 0 && v.a <= 6 && v.b >= 0 && v.b <= 6) { st.a = v.a; st.b = v.b; }
        else if (typeof v.lo === "number" && typeof v.hi === "number" && v.lo >= v.hi && v.hi >= 0 && v.lo <= 6) { st.a = 6 - v.lo; st.b = 6 - v.hi; }
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem("rp-filters2", JSON.stringify({region: st.region, types: st.types, grup: st.grup, a: st.a, b: st.b, sortLoc: st.sortLoc, sortSp: st.sortSp, km: st.km})); } catch (e) {} }
  function mk(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function safe(u) { return typeof u === "string" && u.indexOf("https://") === 0 ? u : null; }
  function link(text, url, cls) { var u = safe(url); if (!u) return mk("span", cls, text); var a = mk("a", cls, text); a.href = u; a.target = "_blank"; a.rel = "noopener"; return a; }

  // Map pills: Google Maps / Organic Maps favicons instead of text labels.
  var FAV = {
    gm: "https://www.google.com/s2/favicons?sz=32&domain=maps.google.com",
    om: "https://www.google.com/s2/favicons?sz=32&domain=organicmaps.app"
  };
  function mapLink(url, svc) {
    var u = safe(url);
    if (!u) return mk("span", "pin");
    var a = mk("a", "pin");
    a.href = u; a.target = "_blank"; a.rel = "noopener";
    a.title = svc === "gm" ? "Google Maps" : "Organic Maps";
    a.setAttribute("aria-label", a.title);
    var img = mk("img");
    img.src = FAV[svc]; img.alt = a.title; img.loading = "lazy"; img.width = 13; img.height = 13;
    a.appendChild(img);
    return a;
  }

  // Days-ago values computed ONCE at startup — dates used to be re-parsed on
  // every render (region pills × groups × observations). The same pass caches
  // each observation's coordinates (parsed from the gm link) for regions that
  // have a reference point (distance filter + distance sorting).
  var POINTS = {};
  data.regions.forEach(function (r) { var p = parsePoint(r.p); if (p) POINTS[r.n] = p; });
  data.groups.forEach(function (g) { g.obs.forEach(function (o) { o._n = dAgo(o.d); if (POINTS[g.r]) o._ll = parseLatLng(o.gm); }); });
  function visible(g) {
    var pt = POINTS[g.r];
    return g.obs.filter(function (o) {
      if (o._n < st.hi || o._n > st.lo || st.types[o.t] === false) return false;
      // Distance filter: 150 km = rightmost = no limit; observations without
      // coordinates (no gm link — ~1% of the data) always pass.
      if (pt && st.km < 150 && o._ll && haversine(pt, o._ll) > st.km) return false;
      return true;
    });
  }

  function button(parent, cls, label, count, pressed, fn) {
    var b = mk("button", cls); b.type = "button"; b.setAttribute("aria-pressed", pressed ? "true" : "false");
    b.appendChild(document.createTextNode(label));
    if (count != null) b.appendChild(mk("span", "n", String(count)));
    b.addEventListener("click", fn); parent.appendChild(b); return b;
  }

  function rangeLabel() {
    if (st.hi === 0 && st.lo === 6) return "ostatnie 7 dni";
    if (st.hi === st.lo) return st.hi === 0 ? "dziś" : dateAgo(st.hi) + " (" + (st.hi === 1 ? "wczoraj" : st.hi + " dni temu") + ")";
    var n = st.lo - st.hi + 1;
    return dateAgo(st.lo) + " – " + dateAgo(st.hi) + " (" + n + (n === 1 ? " dzień" : " dni") + ")";
  }

  function slider() {
    var rA = el("rA"), rB = el("rB");
    rA.oninput = function () { st.a = +rA.value; sync(); };
    rB.oninput = function () { st.b = +rB.value; sync(); };
    var ticks = el("rticks"); ticks.textContent = "";
    for (var i = 0; i <= 6; i++) ticks.appendChild(mk("span", null, dateAgo(6 - i)));
    sync();
  }
  // Distance filter (one handle, 5–150 km from the region's reference point;
  // 150 = rightmost = no limit). Hidden when no region has a point; applies
  // in EVERY view because the filtering lives in visible().
  function kmSlider() {
    if (!Object.keys(POINTS).length) return;
    el("kmRange").hidden = false;
    el("kmfill").style.left = "0";
    el("kmR").oninput = function () { st.km = +el("kmR").value; kmSync(); };
    kmSync(true);
  }
  function kmSync(skipDraw) {
    el("kmR").value = st.km;
    el("kmfill").style.width = ((st.km - 5) / 145 * 100) + "%";
    el("kmlbl").textContent = st.km >= 150 ? "bez limitu" : "do " + st.km + " km";
    save();
    if (skipDraw) return;
    if (!rafPending) { rafPending = true; raf(function () { rafPending = false; draw(); }); }
  }
  function sync() {
    st.lo = 6 - Math.min(st.a, st.b);   // older range bound (more days ago)
    st.hi = 6 - Math.max(st.a, st.b);   // newer range bound (closer to today)
    el("rA").value = st.a; el("rB").value = st.b;
    var p = function (v) { return v / 6 * 100; };
    el("rfill").style.left = p(Math.min(st.a, st.b)) + "%";
    el("rfill").style.width = (p(Math.max(st.a, st.b)) - p(Math.min(st.a, st.b))) + "%";
    el("rlbl").textContent = rangeLabel();
    save();
    // Render once per frame (rAF), not on every input event — smooth slider dragging.
    if (!rafPending) { rafPending = true; raf(function () { rafPending = false; draw(); }); }
  }

  function controls(total, perCounts) {
    var reg = el("regions"); reg.textContent = "";
    button(reg, "pill", "Wszystkie", total, st.region === "", function () { st.region = ""; save(); draw(); });
    data.regions.forEach(function (r, i) {
      var c = perCounts[i];
      var b = button(reg, "pill" + (c === 0 ? " zero" : ""), r.n, c, st.region === r.n, function () { st.region = r.n; save(); draw(); });
      if (r.d) b.title = "region dzienny";
    });
    var gb = el("groupby"); gb.textContent = "";
    gb.appendChild(mk("span", "range-cap", "grupowanie"));
    button(gb, "pill", "wg gatunków", null, st.grup === "gatunki", function () { st.grup = "gatunki"; save(); draw(); });
    button(gb, "pill", "wg lokalizacji", null, st.grup === "lokalizacje", function () { st.grup = "lokalizacje"; save(); draw(); });
    button(gb, "pill", "mapa", null, st.grup === "mapa", function () { st.grup = "mapa"; save(); draw(); });
    // locations view: sort alphabetically, by observation count (default) or by
    // distance from the region's reference point (settings "Punkt" → region p,
    // format "szer,dł"; the distance pill needs at least one region with a point)
    if (st.grup === "lokalizacje") {
      gb.appendChild(mk("span", "range-cap", "sortowanie"));
      button(gb, "pill", "alfabetycznie", null, st.sortLoc === "alpha", function () { st.sortLoc = "alpha"; save(); draw(); });
      button(gb, "pill", "obserwacje", null, st.sortLoc !== "alpha" && st.sortLoc !== "dist", function () { st.sortLoc = ""; save(); draw(); });
      if (data.regions.some(function (r) { return parsePoint(r.p); }))
        button(gb, "pill", "odległość", null, st.sortLoc === "dist", function () { st.sortLoc = "dist"; save(); draw(); });
    }
    // species view: alphabetical (default) or by observation count
    if (st.grup === "gatunki") {
      gb.appendChild(mk("span", "range-cap", "sortowanie"));
      button(gb, "pill", "alfabetycznie", null, st.sortSp !== "count", function () { st.sortSp = ""; save(); draw(); });
      button(gb, "pill", "obserwacje", null, st.sortSp === "count", function () { st.sortSp = "count"; save(); draw(); });
    }
    // compact expand/collapse-all toggle for the collapsible blocks below
    // (species and location lists are <details> collapsed by default)
    if (st.grup !== "mapa") {
      var mini = mk("button", "mini");
      mini.type = "button";
      mini.textContent = "rozwiń wszystko";
      mini.onclick = function () {
        var all = Array.prototype.slice.call(el("out").querySelectorAll("details"));
        var open = all.length > 0 && all.every(function (d) { return d.open; });
        all.forEach(function (d) { d.open = !open; });
        mini.textContent = open ? "rozwiń wszystko" : "zwiń wszystko";
      };
      gb.appendChild(mini);
    }
    var ty = el("types"); ty.textContent = "";
    TYPES.forEach(function (t) {
      var b = button(ty, "chip", t[1], null, st.types[t[0]] !== false, function () { st.types[t[0]] = st.types[t[0]] === false; save(); draw(); });
      b.insertBefore(mk("span", "dot " + t[2]), b.firstChild);
    });
  }

  function bestKind(g, obs) {
    var best = g.v;
    obs.forEach(function (o) { if ((o.t === "Lifer") || (o.t === "Rare" && best !== "Lifer")) best = o.t; });
    return best;
  }
  function kindSpan(best) {
    var k = mk("span", "kind " + (best === "Lifer" ? "lifer" : best === "Rare" ? "rare" : "tick"));
    k.appendChild(mk("span", "dot"));
    k.appendChild(document.createTextNode(KIND_PL[best] || best || ""));
    return k;
  }

  function species(g, obs) {
    var box = mk("div", "sp");
    var best = bestKind(g, obs);
    var kindCls = best === "Lifer" ? "lifer" : best === "Rare" ? "rare" : "tick";
    var nm = mk("div", "nm");
    nm.appendChild(link(g.pl || g.en || g.la || "?", g.u));
    nm.appendChild(mk("span", "la", g.la || ""));
    var kind = mk("span", "kind " + kindCls);
    kind.appendChild(mk("span", "dot"));
    kind.appendChild(document.createTextNode(KIND_PL[best] || best || ""));
    nm.appendChild(kind);
    box.appendChild(nm);
    var places = []; obs.forEach(function (o) { if (places.every(function (p) { return p.l !== o.l; })) places.push(o); });
    var det = mk("details");
    if (places.length > 3) {
      // Many places: the places line IS the toggle — the summary hides the full
      // list, so there is no separate "x obs." (it would repeat the same
      // affordance one line below).
      var sumMany = mk("summary", "places");
      sumMany.appendChild(document.createTextNode(places.length + " miejsc — pełna lista w szczegółach"));
      det.appendChild(sumMany);
    } else {
      // Few places: listed inline with map pins; "x obs." opens the full list.
      var pl = mk("div", "places");
      places.forEach(function (o, i) {
        if (i) pl.appendChild(document.createTextNode(" · "));
        pl.appendChild(o.lu ? link(o.l, o.lu) : document.createTextNode(o.l));
        if (o.gm) pl.appendChild(mapLink(o.gm, "gm"));
        if (o.om) pl.appendChild(mapLink(o.om, "om"));
      });
      box.appendChild(pl);
      det.appendChild(mk("summary", null, obs.length + " obs."));
    }
    var ul = mk("ul");
    obs.forEach(function (o) {
      var li = mk("li");
      li.appendChild(link(fmt(o.d), o.c, "d"));
      li.appendChild(document.createTextNode(" — "));
      li.appendChild(o.lu ? link(o.l, o.lu) : document.createTextNode(o.l));
      if (o.gm) li.appendChild(mapLink(o.gm, "gm"));
      if (o.om) li.appendChild(mapLink(o.om, "om"));
      li.appendChild(document.createTextNode(" · "));
      li.appendChild(mk("span", "t", KIND_PL[o.t] || o.t || ""));
      if (o.n === 1) li.appendChild(mk("span", "new", "nowe"));
      ul.appendChild(li);
    });
    det.appendChild(ul); box.appendChild(det);
    return box;
  }

  // Location block ("by locations" mode): header = place name with map links,
  // below it the list of species observed at this place (date + kind dot).
  // The whole block is a <details class="loc"> COLLAPSED BY DEFAULT — the header
  // line doubles as the toggle (summary.nm), the species list unfolds on click.
  function locationBlock(loc) {
    var box = mk("div", "sp");
    var det = mk("details", "loc");
    var nm = mk("summary", "nm");
    var shown = loc.lu ? link(loc.name, loc.lu) : loc.gm ? link(loc.name, loc.gm) : mk("span", null, loc.name);
    nm.appendChild(shown);
    nm.appendChild(mk("span", "cnt", loc.entries.length + " gat."));
    if (st.sortLoc === "dist" && loc.dist !== null) nm.appendChild(mk("span", "cnt", fmtKm(loc.dist)));
    if (loc.gm) nm.appendChild(mapLink(loc.gm, "gm"));
    if (loc.om) nm.appendChild(mapLink(loc.om, "om"));
    det.appendChild(nm);
    var ul = mk("ul");
    loc.entries.forEach(function (e) {
      var g = e[0], obs = e[1];
      var li = mk("li");
      li.appendChild(link(g.pl || g.en || g.la || "?", g.u));
      li.appendChild(kindSpan(bestKind(g, obs)));
      li.appendChild(document.createTextNode(" — "));
      obs.forEach(function (o, i) {
        if (i) li.appendChild(document.createTextNode(" · "));
        li.appendChild(link(fmt(o.d), o.c, "d"));
        if (o.n === 1) li.appendChild(mk("span", "new", "nowe"));
      });
      ul.appendChild(li);
    });
    det.appendChild(ul);
    box.appendChild(det);
    return box;
  }

  // Regroup visible observations of a region by location. In distance mode
  // (sortLoc "dist" + the region's reference point) locations sort by their
  // distance from that point; locations without coordinates land at the end.
  function haversine(a, b) {
    var R = 6371, rad = Math.PI / 180;
    var dLa = (b[0] - a[0]) * rad, dLo = (b[1] - a[1]) * rad;
    var s = Math.sin(dLa / 2) * Math.sin(dLa / 2) +
            Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function fmtKm(km) {
    var v = km >= 100 ? Math.round(km) : Math.round(km * 10) / 10;
    return String(v).replace(".", ",") + " km";
  }
  function byLocations(items, regionName) {
    var point = parsePoint((data.regions.filter(function (r) { return r.n === regionName; })[0] || {}).p);
    var distMode = point !== null && st.sortLoc === "dist";
    var locs = [], byKey = {};
    items.forEach(function (x) {
      var g = x[0], key0 = g.u || (g.la + "|" + g.pl);
      x[1].forEach(function (o) {
        var key = o.l || "";
        var loc = byKey[key];
        if (!loc) {
          loc = {name: o.l || "(bez lokalizacji)", lu: null, gm: null, om: null, entries: [], seen: {}, nObs: 0,
                 ll: null, dist: null};
          byKey[key] = loc; locs.push(loc);
        }
        loc.nObs++;
        if (distMode && loc.ll === null) { loc.ll = parseLatLng(o.gm); }
        if (!loc.lu && o.lu) loc.lu = o.lu;
        if (!loc.gm && o.gm) loc.gm = o.gm;
        if (!loc.om && o.om) loc.om = o.om;
        var ent = loc.seen[key0];
        if (!ent) { ent = [g, []]; loc.seen[key0] = ent; loc.entries.push(ent); }
        ent[1].push(o);
      });
    });
    if (distMode) locs.forEach(function (l) { if (l.ll) l.dist = haversine(point, l.ll); });
    locs.sort(function (a, b) {
      // localeCompare: Polish ordering (ą, ć, ł, ż…), not ASCII codes
      if (distMode) {
        var da = a.dist === null ? Infinity : a.dist, db = b.dist === null ? Infinity : b.dist;
        return da - db || a.name.localeCompare(b.name, "pl");
      }
      if (st.sortLoc === "alpha") return a.name.localeCompare(b.name, "pl");
      return b.nObs - a.nObs || a.name.localeCompare(b.name, "pl");
    });
    return locs;
  }

  // --- map view: Leaflet + CARTO Positron tiles, lazy-loaded on first use.
  // Pin size and color scale with the number of visible observations at a
  // location (moss → ochre → warn); coordinates come from the Google Maps
  // links already embedded in the data (?q=lat,lng), so the engine stays
  // untouched. ---
  var KIND_HEX = { "Lifer": "#47634a", "Rare": "#a3762e", "Year tick": "#6d7566" };
  var leafletPromise = null;
  var mapObj = null;
  // CARTO raster basemaps require an API key (since 2026-09-25; free for
  // non-commercial use). The Cloudflare Worker serving the page injects the
  // key at request time (secret CARTO_API_KEY) by replacing the __CARTO_KEY__
  // token below. Where the token stays unreplaced (canvas preview) no ?key=
  // is appended — CARTO answers with its "API key required" watermark tiles.
  var CARTO_KEY = "__CARTO_KEY__";
  function cartoTiles() {
    return "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png" +
      (CARTO_KEY && CARTO_KEY !== "__CARTO_KEY__" ? "?key=" + encodeURIComponent(CARTO_KEY) : "");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function loadLeaflet() {
    if (typeof L !== "undefined") return Promise.resolve();
    if (leafletPromise) return leafletPromise;
    leafletPromise = new Promise(function (resolve, reject) {
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
      document.head.appendChild(css);
      var js = document.createElement("script");
      js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
      js.onload = function () { resolve(); };
      js.onerror = function () { leafletPromise = null; reject(new Error("leaflet failed to load")); };
      document.head.appendChild(js);
    });
    return leafletPromise;
  }
  function parseLatLng(gm) {
    var m = /[?&]q=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(gm || "");
    if (!m) return null;
    var la = +m[1], lo = +m[2];
    return (la >= -85 && la <= 85 && lo >= -180 && lo <= 180) ? [la, lo] : null;
  }
  // reference point "szer,dł" (decimal degrees, comma) from the region settings
  function parsePoint(p) {
    var m = /^(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)$/.exec(String(p == null ? "" : p).trim());
    if (!m) return null;
    var la = +m[1], lo = +m[2];
    return (la >= -85 && la <= 85 && lo >= -180 && lo <= 180) ? [la, lo] : null;
  }
  function hexMix(h1, h2, t) {
    var p = function (h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
    var a = p(h1), b = p(h2);
    return "rgb(" + [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * t); }).join(",") + ")";
  }
  function pinColor(t) {
    return t < 0.55 ? hexMix("#47634a", "#a3762e", t / 0.55) : hexMix("#a3762e", "#8a5a2b", (t - 0.55) / 0.45);
  }
  // aggregate visible observations into map locations (key: region + name)
  function mapLocations(per) {
    var by = {}, locs = [], noCoords = 0;
    per.forEach(function (row) {
      if (st.region && st.region !== row[0].n) return;
      row[1].forEach(function (x) {
        var g = x[0];
        x[1].forEach(function (o) {
          var ll = parseLatLng(o.gm);
          if (!ll) { noCoords++; return; }
          var key = g.r + "" + (o.l || "");
          var loc = by[key];
          if (!loc) { loc = { name: o.l || "(bez lokalizacji)", region: g.r, ll: ll, obs: 0, sp: {}, gm: o.gm, om: o.om }; by[key] = loc; locs.push(loc); }
          loc.obs++;
          if (!loc.om && o.om) loc.om = o.om;
          var nm = g.pl || g.en || g.la || "?";
          var s = loc.sp[nm] || (loc.sp[nm] = { n: 0, best: "Year tick" });
          s.n++;
          if (o.t === "Lifer" || (o.t === "Rare" && s.best !== "Lifer")) s.best = o.t;
        });
      });
    });
    return { locs: locs, noCoords: noCoords };
  }
  function popupHtml(l) {
    var names = Object.keys(l.sp).sort(function (a, b) { return l.sp[b].n - l.sp[a].n; });
    var rows = names.slice(0, 8).map(function (n) {
      var s = l.sp[n];
      return "<div><span style=\"color:" + KIND_HEX[s.best] + "\">●</span> " + esc(n) + (s.n > 1 ? " ×" + s.n : "") + "</div>";
    }).join("");
    if (names.length > 8) rows += "<div style=\"opacity:.6\">… +" + (names.length - 8) + " gat.</div>";
    var h = "<strong>" + esc(l.name) + "</strong><div>" + esc(l.region) + " · " + l.obs + " obs. · " + names.length + " gat.</div>" + rows;
    h += "<div style=\"margin-top:4px\"><a href=\"" + esc(l.gm) + "\" target=\"_blank\" rel=\"noopener\">Google Maps</a>";
    if (l.om) h += " · <a href=\"" + esc(l.om) + "\" target=\"_blank\" rel=\"noopener\">Organic Maps</a>";
    h += "</div>";
    return h;
  }
  function renderMap(box, locs, points) {
    if (mapObj) { mapObj.remove(); mapObj = null; }  // draw() dropped the old container
    box.textContent = "";
    points = points || [];
    if (!locs.length && !points.length) {
      var e = mk("div", "map-empty");
      e.textContent = "Brak obserwacji ze współrzędnymi w wybranym zakresie.";
      box.appendChild(e);
      return;
    }
    var maxC = 1;
    locs.forEach(function (l) { if (l.obs > maxC) maxC = l.obs; });
    loadLeaflet().then(function () {
      if (!box.isConnected) return;  // a filter change rebuilt the page meanwhile
      var m = L.map(box);
      L.tileLayer(cartoTiles(), {
        maxZoom: 19,
        attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> &copy; <a href=\"https://carto.com/attributions\">CARTO</a>"
      }).addTo(m);
      var bounds = L.latLngBounds();
      locs.forEach(function (l) {
        var t = maxC > 1 ? Math.log(l.obs) / Math.log(maxC) : 0;
        L.circleMarker(l.ll, {
          radius: 6 + 10 * t,
          color: "#33322a", weight: 1.2, opacity: 0.5,
          fillColor: pinColor(t), fillOpacity: 0.85
        }).addTo(m).bindPopup(popupHtml(l));
        bounds.extend(l.ll);
      });
      points.forEach(function (p) {
        L.marker(p.ll, { icon: L.divIcon({
          className: "ref-pin", iconSize: [26, 26], iconAnchor: [13, 13],
          html: "<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\"><path d=\"M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z\" fill=\"#33322a\" stroke=\"#f6f3ea\" stroke-width=\"1.2\"/></svg>"
        }) }).addTo(m).bindPopup("<strong>Punkt odniesienia</strong><div>" + esc(p.name) + " — od niego liczy się sortowanie wg odległości.</div>");
        bounds.extend(p.ll);
      });
      m.fitBounds(bounds, { padding: [26, 26], maxZoom: 13 });
      mapObj = m;
    }).catch(function () {
      if (!box.isConnected) return;
      box.textContent = "";
      var e = mk("div", "map-empty");
      e.textContent = "Nie udało się załadować mapy (Leaflet / kafle OSM).";
      box.appendChild(e);
    });
  }
  function mapLegend(maxC) {
    var lg = mk("div", "map-legend");
    lg.appendChild(document.createTextNode("rozmiar i kolor pinezki = liczba obserwacji:"));
    var stops = maxC === 1 ? [1] : [1, Math.ceil(maxC / 2), maxC];
    stops.forEach(function (c, i) {
      if (i && stops[i] === stops[i - 1]) return;
      var t = maxC > 1 ? Math.log(c) / Math.log(maxC) : 0;
      var sw = mk("span", "sw");
      sw.style.width = sw.style.height = Math.round(9 + 12 * t) + "px";
      sw.style.background = pinColor(t);
      lg.appendChild(sw);
      lg.appendChild(mk("span", null, c + " obs."));
    });
    return lg;
  }
  function mapSection(per) {
    var agg = mapLocations(per);
    var sec = mk("section");
    var h = mk("h2", null, st.region || "Wszystkie regiony");
    var nObs = 0; agg.locs.forEach(function (l) { nObs += l.obs; });
    var cnt = agg.locs.length + " miejsc · " + nObs + " obs.";
    if (agg.noCoords) cnt += " · " + agg.noCoords + " bez współrzędnych";
    h.appendChild(mk("span", "cnt", cnt));
    sec.appendChild(h);
    sec.appendChild(mk("hr", "region-hr"));
    // reference points of the visible regions (region p, format "szer,dł")
    var points = [];
    data.regions.forEach(function (r) {
      if (st.region && st.region !== r.n) return;
      var ll = parsePoint(r.p);
      if (ll) points.push({ name: r.n, ll: ll });
    });
    var box = mk("div", "mapbox");
    sec.appendChild(box);
    if (agg.locs.length) sec.appendChild(mapLegend(Math.max.apply(null, agg.locs.map(function (l) { return l.obs; }))));
    renderMap(box, agg.locs, points);
    return sec;
  }

  function draw() {
    // One pass: visible groups per region — species counts for the pills
    // (controls) and the sections to render come from it; no second data scan.
    var per = [];
    var total = 0;
    data.regions.forEach(function (r) {
      var items = [];
      data.groups.forEach(function (g) { if (g.r === r.n) { var v = visible(g); if (v.length) items.push([g, v]); } });
      per.push([r, items]);
      total += items.length;
    });
    controls(total, per.map(function (row) { return row[1].length; }));
    var out = el("out"); out.textContent = "";
    var shown = 0;
    if (st.grup === "mapa") {
      out.appendChild(mapSection(per));
      shown++;  // the map section carries its own empty message
    }
    per.forEach(function (row) {
      var r = row[0], items = row[1];
      if (st.grup === "mapa") return;
      if (st.region && st.region !== r.n) return;
      if (!items.length) return;
      var sec = mk("section");
      var h = mk("h2", null, r.n);
      var nObs = items.reduce(function (a, x) { return a + x[1].length; }, 0);
      h.appendChild(mk("span", "cnt", items.length + " gat. · " + nObs + " obs."));
      sec.appendChild(h);
      sec.appendChild(mk("hr", "region-hr"));
      var list = mk("div", "list");
      if (st.grup === "lokalizacje") {
        byLocations(items, r.n).forEach(function (loc) { list.appendChild(locationBlock(loc)); shown++; });
      } else {
        // Species view: alphabetical (default) or by observation count.
        var sp = items.slice().sort(function (a, b) {
          var an = a[0].pl || a[0].en || a[0].la || "?", bn = b[0].pl || b[0].en || b[0].la || "?";
          if (st.sortSp === "count") return b[1].length - a[1].length || an.localeCompare(bn, "pl");
          return an.localeCompare(bn, "pl");
        });
        sp.forEach(function (x) { list.appendChild(species(x[0], x[1])); shown++; });
      }
      sec.appendChild(list); out.appendChild(sec);
    });
    if (!shown) {
      var emp = mk("div", "empty");
      emp.insertAdjacentHTML("beforeend", '<svg width="72" height="24" viewBox="0 0 72 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="opacity:0.5;display:block;margin:0 auto 10px"><path d="M8 8 Q17 17 26 8"></path><path d="M42 5 Q52 15 62 5"></path></svg>');
      emp.appendChild(mk("span", null, "Brak obserwacji w wybranym zakresie."));
      out.appendChild(emp);
    }
  }

  load();
  slider();
  kmSlider();
  var f = (data.from || "").split("-"), t = (data.today || "").split("-");
  el("meta").textContent = (f.length === 3 ? f[2] + "." + f[1] : "") + " – " + (t.length === 3 ? t[2] + "." + t[1] : "") + " · zaktualizowano " + (data.generated || "");
  if (data.stale && data.stale.length) {
    var w = el("stale"); w.hidden = false;
    w.textContent = "Nie udało się pobrać świeżych danych dla: " + data.stale.join(", ") + ". Pokazuję poprzedni stan.";
  }
  el("bar").hidden = false;
})();
</script>
</body>
</html>
